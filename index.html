<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantry & Plate</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Nanum+Myeongjo:wght@400;700;800&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #FBF9F5;
            --primary-color: #9E2A2B;
            --primary-dark: #741E1F;
            --text-main: #2C2C2C;
            --text-muted: #7A7A7A;
            --border-color: #E8E2D5;
            --card-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-title {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
            letter-spacing: -0.5px;
            cursor: pointer;
        }

        .nav-menu {
            display: flex;
            gap: 35px;
            list-style: none;
            align-items: center;
        }

        .nav-menu button {
            background: none;
            border: none;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
            padding: 5px 0;
            position: relative;
        }

        .nav-menu button.active, .nav-menu button:hover {
            color: var(--primary-color);
        }

        .nav-menu button.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--primary-color);
        }

        .scrap-badge {
            background-color: var(--primary-color);
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 5px;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .header-search-icon {
            font-size: 18px;
            color: var(--text-main);
            cursor: pointer;
        }

        .btn-add-recipe {
            background-color: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-add-recipe:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .hero-section {
            text-align: center;
            padding: 40px 20px 20px 20px;
        }

        .emblem-badge {
            display: inline-block;
            border: 1px solid var(--primary-color);
            border-radius: 60px;
            padding: 14px 45px;
            margin-bottom: 25px;
            position: relative;
            box-shadow: inset 0 0 0 1px var(--primary-color);
        }

        .emblem-badge h1 {
            font-family: 'Cinzel', serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .emblem-badge h1::before, .emblem-badge h1::after {
            content: '✦';
            font-size: 14px;
            color: var(--primary-color);
        }

        .sub-categories {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            padding: 0 20px;
        }

        .sub-cat-btn {
            background-color: transparent;
            border: 1px solid var(--border-color);
            padding: 7px 18px;
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .sub-cat-btn.active, .sub-cat-btn:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .search-bar-container {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
            padding: 0 20px;
        }

        .search-box {
            position: relative;
            width: 100%;
            max-width: 450px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px 10px 40px;
            border: 1px solid var(--border-color);
            border-radius: 25px;
            background-color: white;
            font-size: 14px;
            outline: none;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto 60px auto;
            padding: 0 25px;
            width: 100%;
        }

        .recipe-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .recipe-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .recipe-img-wrap {
            width: 100%;
            height: 220px;
            overflow: hidden;
            background-color: #f0ede6;
            position: relative;
        }

        .recipe-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .recipe-card:hover .recipe-img-wrap img {
            transform: scale(1.05);
        }

        .scrap-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255,255,255,0.85);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            transition: color 0.2s;
            z-index: 2;
        }

        .scrap-btn.active {
            color: var(--primary-color);
        }

        .recipe-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .recipe-meta-tag {
            font-size: 11px;
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .recipe-title {
            font-family: 'Nanum Myeongjo', serif;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .recipe-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .recipe-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid #F5F1EB;
            padding-top: 12px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            border-radius: 16px;
            overflow-y: auto;
            position: relative;
            padding: 30px;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .modal-header-img {
            width: 100%;
            height: 280px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 20px;
        }

        .modal-title {
            font-family: 'Nanum Myeongjo', serif;
            font-size: 24px;
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .modal-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .modal-section-title {
            font-size: 16px;
            font-weight: 700;
            margin: 20px 0 10px 0;
            color: var(--text-main);
            border-left: 3px solid var(--primary-color);
            padding-left: 8px;
        }

        .ingredient-list, .step-list {
            list-style: none;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-main);
        }

        .ingredient-list li {
            padding: 6px 0;
            border-bottom: 1px dashed var(--border-color);
            display: flex;
            justify-content: space-between;
        }

        .step-list li {
            margin-bottom: 10px;
            position: relative;
            padding-left: 24px;
        }

        .step-list li::before {
            content: attr(data-step);
            position: absolute;
            left: 0;
            top: 0;
            color: var(--primary-color);
            font-weight: 700;
        }

        .modal-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .modal-actions-left {
            display: flex;
            gap: 10px;
        }

        .btn-delete-recipe {
            background-color: #fff2f2;
            color: #d9534f;
            border: 1px solid #d9534f;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .btn-delete-recipe:hover {
            background-color: #d9534f;
            color: white;
        }

        .btn-edit-recipe {
            background-color: #f0f4f8;
            color: #205493;
            border: 1px solid #205493;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .btn-edit-recipe:hover {
            background-color: #205493;
            color: white;
        }

        /* Form Modal */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-main);
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .form-group textarea {
            resize: vertical;
            height: 100px;
        }

        .btn-submit {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--primary-dark);
        }

        footer {
            text-align: center;
            padding: 30px;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            margin-top: auto;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn-reset-default {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            text-decoration: underline;
            font-size: 13px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            grid-column: 1 / -1;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <header>
        <a class="logo-title" onclick="switchMainTab('재료')">Pantry & Plate</a>
        <ul class="nav-menu">
            <li><button id="navBtn-재료" class="active" onclick="switchMainTab('재료')">재료</button></li>
            <li><button id="navBtn-셰프" onclick="switchMainTab('셰프')">셰프</button></li>
            <li><button id="navBtn-스크랩북" onclick="switchMainTab('스크랩북')">스크랩북 <span class="scrap-badge" id="scrapCountBadge">0</span></button></li>
        </ul>
        <div class="header-actions">
            <i class="fa-solid fa-magnifying-glass header-search-icon" onclick="focusSearch()"></i>
            <button class="btn-add-recipe" onclick="openAddModal()">+ 레시피 등록</button>
        </div>
    </header>

    <section class="hero-section">
        <div class="emblem-badge">
            <h1>Pantry & Plate</h1>
        </div>

        <!-- 하위 카테고리 (재료 탭용) -->
        <div id="subCat-재료" class="sub-categories">
            <button class="sub-cat-btn active" onclick="filterSubCategory('전체', this)">전체</button>
            <button class="sub-cat-btn" onclick="filterSubCategory('계란', this)">계란</button>
            <button class="sub-cat-btn" onclick="filterSubCategory('감자', this)">감자</button>
            <button class="sub-cat-btn" onclick="filterSubCategory('두부', this)">두부</button>
            <button class="sub-cat-btn" onclick="filterSubCategory('돼지고기', this)">돼지고기</button>
            <button class="sub-cat-btn" onclick="filterSubCategory('토마토', this)">토마토</button>
        </div>

        <!-- 하위 카테고리 (셰프 탭용) -->
        <div id="subCat-셰프" class="sub-categories" style="display: none;">
            <button class="sub-cat-btn active" onclick="filterChefCategory('전체', this)">전체 셰프</button>
            <button class="sub-cat-btn" onclick="filterChefCategory('백종원', this)">백종원</button>
            <button class="sub-cat-btn" onclick="filterChefCategory('흑백요리사', this)">흑백요리사</button>
            <button class="sub-cat-btn" onclick="filterChefCategory('어남선생', this)">어남선생(류수영)</button>
            <button class="sub-cat-btn" onclick="filterChefCategory('최현석', this)">최현석</button>
        </div>

        <div class="search-bar-container">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="원하는 요리나 재료를 검색해보세요..." oninput="handleSearch()">
            </div>
        </div>
    </section>

    <main>
        <div class="recipe-grid" id="recipeGrid"></div>
    </main>

    <footer>
        <span>&copy; Pantry & Plate. All Rights Reserved.</span>
        <button class="btn-reset-default" onclick="resetDefaultRecipes()">기본 레시피 초기화</button>
    </footer>

    <!-- 상세 모달 -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeDetailModal()"><i class="fa-solid fa-xmark"></i></button>
            <img id="modalImg" class="modal-header-img" src="" alt="요리 사진">
            <div id="modalTag" class="recipe-meta-tag"></div>
            <h2 id="modalTitle" class="modal-title"></h2>
            <p id="modalDesc" class="modal-subtitle"></p>
            
            <div class="modal-section-title">필요한 재료</div>
            <ul id="modalIngredients" class="ingredient-list"></ul>

            <div class="modal-section-title">조리 순서</div>
            <ul id="modalSteps" class="step-list"></ul>

            <div class="modal-actions">
                <div class="modal-actions-left">
                    <button class="btn-delete-recipe" onclick="deleteCurrentRecipe()"><i class="fa-solid fa-trash"></i> 삭제</button>
                    <button class="btn-edit-recipe" onclick="openEditModal()"><i class="fa-solid fa-pen"></i> 수정</button>
                </div>
                <button class="sub-cat-btn active" onclick="closeDetailModal()">닫기</button>
            </div>
        </div>
    </div>

    <!-- 레시피 등록 및 수정 모달 -->
    <div class="modal-overlay" id="addModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeAddModal()"><i class="fa-solid fa-xmark"></i></button>
            <h2 class="modal-title" id="formModalTitle" style="margin-bottom: 20px;">레시피 등록</h2>
            <form id="addRecipeForm" onsubmit="handleRecipeSubmit(event)">
                <input type="hidden" id="editRecipeId">
                <div class="form-group">
                    <label>요리 이름</label>
                    <input type="text" id="addTitle" required placeholder="예: 토마토 달걀 볶음">
                </div>
                <div class="form-group">
                    <label>어느 목록에 추가할까요?</label>
                    <select id="addMainCategory" onchange="updateSubCategoryOptions()">
                        <option value="재료">재료 목록</option>
                        <option value="셰프">셰프 목록</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="subCategoryLabel">상세 분류 선택</label>
                    <select id="addSubCategory">
                        <!-- 동적 바인딩 -->
                    </select>
                </div>
                <div class="form-group">
                    <label>간단한 한줄 소개</label>
                    <input type="text" id="addDesc" required placeholder="예: 쉽고 빠르게 만드는 브런치 메뉴">
                </div>
                <div class="form-group">
                    <label>요리 사진 첨부 (선택 안 하면 기본 사진 적용)</label>
                    <input type="file" id="addImageFile" accept="image/*">
                </div>
                <div class="form-group">
                    <label>재료 목록 (쉼표로 구분)</label>
                    <textarea id="addIngredientsList" required placeholder="예: 토마토 2개, 달걀 3개, 소금 약간"></textarea>
                </div>
                <div class="form-group">
                    <label>조리 순서 (줄바꿈으로 구분)</label>
                    <textarea id="addStepsList" required placeholder="1. 토마토를 먹기 좋게 썹니다.&#10;2. 달걀을 풀어 볶습니다."></textarea>
                </div>
                <button type="submit" class="btn-submit" id="formSubmitBtn">등록하기</button>
            </form>
        </div>
    </div>

    <script>
        const defaultRecipes = [
            {
                id: 1,
                title: "폭신한 수플레 오믈렛",
                categoryType: "셰프",
                subCategory: "최현석",
                desc: "입에서 살살 녹는 부드러운 호텔식 수플레 오믈렛",
                image: "https://images.unsplash.com/photo-1510693206972-df098062cb71?w=600&auto=format&fit=crop&q=80",
                ingredients: ["계란 3개", "버터 1조각", "설탕 1작은술", "소금 약간"],
                steps: ["흰자와 노른자를 분리합니다.", "흰자를 단단한 머랭으로 만듭니다.", "노른자와 머랭을 살살 섞습니다.", "팬에 버터를 녹이고 약불에서 뚜껑을 덮어 익힙니다."]
            },
            {
                id: 2,
                title: "백종원 감자조림",
                categoryType: "재료",
                subCategory: "감자",
                desc: "단짠단짠 밥도둑 필수 밑반찬 감자조림",
                image: "https://images.unsplash.com/photo-1589301760014-d929f3979dbc?w=600&auto=format&fit=crop&q=80",
                ingredients: ["감자 3개", "간장 5스푼", "설탕 1.5스푼", "참기름 약간", "통깨"],
                steps: ["감자를 먹기 좋은 크기로 썹니다.", "팬에 감자와 물, 간장, 설탕을 넣습니다.", "국물이 자글자글해질 때까지 조려줍니다.", "참기름과 통깨를 뿌려 마무리합니다."]
            },
            {
                id: 3,
                title: "들기름 두부구이",
                categoryType: "재료",
                subCategory: "두부",
                desc: "고소한 들기름 향이 일품인 영양 만점 두부구이",
                image: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&auto=format&fit=crop&q=80",
                ingredients: ["두부 1모", "들기름 3스푼", "간장 양념장 (간장, 파, 마늘)"],
                steps: ["두부를 도톰하게 썰어 물기를 제거합니다.", "팬에 들기름을 두르고 두부를 노릇하게 부칩니다.", "양념장을 얹어 살짝 더 졸여냅니다."]
            },
            {
                id: 4,
                title: "매콤달콤 제육볶음",
                categoryType: "재료",
                subCategory: "돼지고기",
                desc: "누구나 좋아하는 최고의 불향 가득 제육볶음",
                image: "https://images.unsplash.com/photo-1603048588665-791ca8aea617?w=600&auto=format&fit=crop&q=80",
                ingredients: ["돼지고기 앞다리살 400g", "고추장 2스푼", "고춧가루 2스푼", "간장 3스푼"],
                steps: ["분량의 양념장을 만들어 고기를 재워둡니다.", "달군 팬에 양념된 고기를 넣고 센 불로 볶습니다.", "채소를 넣고 숨이 죽을 때까지 마저 볶아줍니다."]
            },
            {
                id: 5,
                title: "나폴리 맛피아 토마토 파스타",
                categoryType: "셰프",
                subCategory: "흑백요리사",
                desc: "깊고 진한 풍미의 정통 이탈리안 토마토 파스타",
                image: "https://images.unsplash.com/photo-1621996346565-e3d5d62847ba?w=600&auto=format&fit=crop&q=80",
                ingredients: ["토마토 홀 1캔", "파스타 면 100g", "마늘 3쪽", "올리브오일", "바질"],
                steps: ["끓는 물에 면을 삶습니다.", "올리브오일에 편마늘을 볶아 향을 냅니다.", "토마토 홀을 넣고 으깨며 끓입니다.", "삶은 면과 소스를 섞어 완성합니다."]
            },
            {
                id: 6,
                title: "백종원 마파두부 덮밥",
                categoryType: "셰프",
                subCategory: "백종원",
                desc: "얼얼하고 매콤한 중독성 강한 마파두부",
                image: "https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=600&auto=format&fit=crop&q=80",
                ingredients: ["두부 1모", "다진 돼지고기 100g", "두반장 2스푼", "고추기름", "전분물"],
                steps: ["두부를 네모지게 썰어 데쳐냅니다.", "고추기름에 돼지고기와 두반장을 볶습니다.", "물과 양념을 넣고 끓이다 두부를 넣습니다.", "전분물로 걸쭉하게 농도를 맞춥니다."]
            }
        ];

        let recipes = JSON.parse(localStorage.getItem('yam_recipes')) || defaultRecipes;
        let scrapList = JSON.parse(localStorage.getItem('yam_scraps')) || [];

        let currentMainTab = '재료';
        let currentSubFilter = '전체';
        let currentChefFilter = '전체';
        let currentSelectedRecipeId = null;

        function saveData() {
            localStorage.setItem('yam_recipes', JSON.stringify(recipes));
            localStorage.setItem('yam_scraps', JSON.stringify(scrapList));
            document.getElementById('scrapCountBadge').innerText = scrapList.length;
        }

        function focusSearch() {
            document.getElementById('searchInput').focus();
        }

        function switchMainTab(tabName) {
            currentMainTab = tabName;
            document.querySelectorAll('.nav-menu button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`navBtn-${tabName}`).classList.add('active');

            const subCatIngredient = document.getElementById('subCat-재료');
            const subCatChef = document.getElementById('subCat-셰프');

            if (tabName === '재료') {
                subCatIngredient.style.display = 'flex';
                subCatChef.style.display = 'none';
                currentSubFilter = '전체';
                subCatIngredient.querySelectorAll('button').forEach((b, idx) => {
                    if(idx === 0) b.classList.add('active');
                    else b.classList.remove('active');
                });
            } else if (tabName === '셰프') {
                subCatIngredient.style.display = 'none';
                subCatChef.style.display = 'flex';
                currentChefFilter = '전체';
                subCatChef.querySelectorAll('button').forEach((b, idx) => {
                    if(idx === 0) b.classList.add('active');
                    else b.classList.remove('active');
                });
            } else {
                subCatIngredient.style.display = 'none';
                subCatChef.style.display = 'none';
            }

            renderRecipes();
        }

        function filterSubCategory(category, btnElement) {
            currentSubFilter = category;
            const parent = btnElement.parentElement;
            parent.querySelectorAll('.sub-cat-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            renderRecipes();
        }

        function filterChefCategory(chefName, btnElement) {
            currentChefFilter = chefName;
            const parent = btnElement.parentElement;
            parent.querySelectorAll('.sub-cat-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            renderRecipes();
        }

        function toggleScrap(id, event) {
            event.stopPropagation();
            const index = scrapList.indexOf(id);
            if (index > -1) {
                scrapList.splice(index, 1);
            } else {
                scrapList.push(id);
            }
            saveData();
            renderRecipes();
        }

        function renderRecipes() {
            const grid = document.getElementById('recipeGrid');
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            document.getElementById('scrapCountBadge').innerText = scrapList.length;

            let filtered = recipes.filter(r => {
                const matchKeyword = r.title.toLowerCase().includes(keyword) || r.desc.toLowerCase().includes(keyword) || r.subCategory.toLowerCase().includes(keyword);
                if (!matchKeyword) return false;

                if (currentMainTab === '재료') {
                    if (r.categoryType !== '재료') return false;
                    if (currentSubFilter !== '전체' && r.subCategory !== currentSubFilter) return false;
                } else if (currentMainTab === '셰프') {
                    if (r.categoryType !== '셰프') return false;
                    if (currentChefFilter !== '전체' && r.subCategory !== currentChefFilter) return false;
                } else if (currentMainTab === '스크랩북') {
                    if (!scrapList.includes(r.id)) return false;
                }
                return true;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-state">등록된 레시피가 없거나 검색 결과가 없습니다.</div>`;
                return;
            }

            grid.innerHTML = filtered.map(r => {
                const isScraped = scrapList.includes(r.id);
                return `
                    <div class="recipe-card" onclick="openDetailModal(${r.id})">
                        <button class="scrap-btn ${isScraped ? 'active' : ''}" onclick="toggleScrap(${r.id}, event)">
                            <i class="fa-solid fa-bookmark"></i>
                        </button>
                        <div class="recipe-img-wrap">
                            <img src="${r.image}" alt="${r.title}">
                        </div>
                        <div class="recipe-info">
                            <div class="recipe-meta-tag">${r.categoryType} · ${r.subCategory}</div>
                            <div class="recipe-title">${r.title}</div>
                            <div class="recipe-desc">${r.desc}</div>
                            <div class="recipe-footer">
                                <span><i class="fa-regular fa-clock"></i> 20분 내외</span>
                                <span><i class="fa-solid fa-utensils"></i> 상세보기</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function handleSearch() {
            renderRecipes();
        }

        function openDetailModal(id) {
            currentSelectedRecipeId = id;
            const recipe = recipes.find(r => r.id === id);
            if (!recipe) return;

            document.getElementById('modalImg').src = recipe.image;
            document.getElementById('modalTag').innerText = `${recipe.categoryType} · ${recipe.subCategory}`;
            document.getElementById('modalTitle').innerText = recipe.title;
            document.getElementById('modalDesc').innerText = recipe.desc;

            const ingList = document.getElementById('modalIngredients');
            ingList.innerHTML = recipe.ingredients.map(ing => `<li><span>${ing}</span></li>`).join('');

            const stepList = document.getElementById('modalSteps');
            stepList.innerHTML = recipe.steps.map((step, idx) => `<li data-step="${idx + 1}.">${step}</li>`).join('');

            document.getElementById('detailModal').classList.add('open');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('open');
        }

        function deleteCurrentRecipe() {
            if (!confirm('정말 이 레시피를 삭제하시겠습니까?')) return;
            recipes = recipes.filter(r => r.id !== currentSelectedRecipeId);
            scrapList = scrapList.filter(id => id !== currentSelectedRecipeId);
            saveData();
            closeDetailModal();
            renderRecipes();
        }

        function openAddModal() {
            document.getElementById('editRecipeId').value = '';
            document.getElementById('formModalTitle').innerText = '레시피 등록';
            document.getElementById('formSubmitBtn').innerText = '등록하기';
            document.getElementById('addRecipeForm').reset();
            updateSubCategoryOptions();
            document.getElementById('addModal').classList.add('open');
        }

        function openEditModal() {
            closeDetailModal();
            const recipe = recipes.find(r => r.id === currentSelectedRecipeId);
            if (!recipe) return;

            document.getElementById('editRecipeId').value = recipe.id;
            document.getElementById('formModalTitle').innerText = '레시피 수정하기';
            document.getElementById('formSubmitBtn').innerText = '수정 완료';

            document.getElementById('addTitle').value = recipe.title;
            document.getElementById('addMainCategory').value = recipe.categoryType;
            updateSubCategoryOptions();
            document.getElementById('addSubCategory').value = recipe.subCategory;
            document.getElementById('addDesc').value = recipe.desc;
            document.getElementById('addIngredientsList').value = recipe.ingredients.join(', ');
            document.getElementById('addStepsList').value = recipe.steps.join('\n');

            document.getElementById('addModal').classList.add('open');
        }

        function updateSubCategoryOptions() {
            const mainCat = document.getElementById('addMainCategory').value;
            const subSelect = document.getElementById('addSubCategory');
            subSelect.innerHTML = '';

            if (mainCat === '재료') {
                ['계란', '감자', '두부', '돼지고기', '토마토'].forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item;
                    opt.innerText = item;
                    subSelect.appendChild(opt);
                });
            } else {
                ['백종원', '흑백요리사', '어남선생', '최현석'].forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item;
                    opt.innerText = item;
                    subSelect.appendChild(opt);
                });
            }
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('open');
            document.getElementById('addRecipeForm').reset();
        }

        function handleRecipeSubmit(event) {
            event.preventDefault();
            const editId = document.getElementById('editRecipeId').value;
            const title = document.getElementById('addTitle').value;
            const categoryType = document.getElementById('addMainCategory').value;
            const subCategory = document.getElementById('addSubCategory').value;
            const desc = document.getElementById('addDesc').value;
            const ingredientsRaw = document.getElementById('addIngredientsList').value;
            const stepsRaw = document.getElementById('addStepsList').value;
            const imageFile = document.getElementById('addImageFile').files[0];

            const ingredients = ingredientsRaw.split(',').map(i => i.trim()).filter(Boolean);
            const steps = stepsRaw.split('\n').map(s => s.trim()).filter(Boolean);

            const defaultImages = {
                "계란": "https://images.unsplash.com/photo-1510693206972-df098062cb71?w=600&auto=format&fit=crop&q=80",
                "감자": "https://images.unsplash.com/photo-1589301760014-d929f3979dbc?w=600&auto=format&fit=crop&q=80",
                "두부": "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&auto=format&fit=crop&q=80",
                "돼지고기": "https://images.unsplash.com/photo-1603048588665-791ca8aea617?w=600&auto=format&fit=crop&q=80",
                "토마토": "https://images.unsplash.com/photo-1621996346565-e3d5d62847ba?w=600&auto=format&fit=crop&q=80",
                "백종원": "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=600&auto=format&fit=crop&q=80",
                "흑백요리사": "https://images.unsplash.com/photo-1556910103-1c02745aae4d?w=600&auto=format&fit=crop&q=80",
                "어남선생": "https://images.unsplash.com/photo-1507048331137-7a3c913ea653?w=600&auto=format&fit=crop&q=80",
                "최현석": "https://images.unsplash.com/photo-1577219491135-ce391730fb2c?w=600&auto=format&fit=crop&q=80"
            };

            if (imageFile) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    saveRecipeData(editId, title, categoryType, subCategory, desc, ingredients, steps, e.target.result);
                };
                reader.readAsDataURL(imageFile);
            } else {
                let existingImage = null;
                if (editId) {
                    const existing = recipes.find(r => r.id == editId);
                    if (existing) existingImage = existing.image;
                }
                const fallbackImg = existingImage || defaultImages[subCategory] || "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&auto=format&fit=crop&q=80";
                saveRecipeData(editId, title, categoryType, subCategory, desc, ingredients, steps, fallbackImg);
            }
        }

        function saveRecipeData(editId, title, categoryType, subCategory, desc, ingredients, steps, image) {
            if (editId) {
                recipes = recipes.map(r => {
                    if (r.id == editId) {
                        return { ...r, title, categoryType, subCategory, desc, ingredients, steps, image };
                    }
                    return r;
                });
            } else {
                const newRecipe = {
                    id: Date.now(),
                    title,
                    categoryType,
                    subCategory,
                    desc,
                    image,
                    ingredients,
                    steps
                };
                recipes.unshift(newRecipe);
            }

            saveData();
            closeAddModal();
            renderRecipes();
        }

        function resetDefaultRecipes() {
            if (confirm('모든 레시피를 기본 설정으로 초기화하시겠습니까?')) {
                recipes = [...defaultRecipes];
                scrapList = [];
                saveData();
                renderRecipes();
            }
        }

        // 초기 실행
        updateSubCategoryOptions();
        saveData();
        renderRecipes();
    </script>
</body>
</html>
